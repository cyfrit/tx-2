<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1d2421">
<title>TX-2 · Lincoln Laboratory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><span class="plate">TX-2</span><span class="sub">MIT LINCOLN LABORATORY</span></div>
    <div class="status">
      <span class="lamp" id="run-lamp" title="RUN"></span><span id="run-text">POWER</span>
      <span class="readout" id="where">K 00 · P 000000</span>
    </div>
    <div class="bar-actions">
      <button class="key" id="pause" title="Emulator pause/resume">❚❚</button>
      <button class="key" id="step" title="Emulator single-instruction step">STEP</button>
      <button class="key red" id="power" title="Power-on reset: clear memory">POWER</button>
    </div>
    <a class="github-badge" href="https://github.com/cyfrit/tx-2" aria-label="View TX-2 on GitHub">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span>GitHub</span>
    </a>
  </header>
  <main class="deck">
    <section class="scope-bay">
      <div class="bezel">
        <div class="crt" id="crt">
          <canvas id="glow" width="1024" height="1024"></canvas>
          <canvas id="beam" width="1024" height="1024"></canvas>
          <canvas id="overlay" width="1024" height="1024"></canvas>
          <div class="glass"></div>
          <div class="boot" id="boot">Loading WebAssembly TX-2…</div>
        </div>
      </div>
      <div class="scope-strip">
        <button class="key small" id="pen-toggle">Light pen ▲</button>
        <span class="lamp small" id="pen-lamp" title="Light pen detected a spot"></span>
        <span class="readout small" id="pen-pos">X +0 Y +0</span>
        <span class="spacer"></span>
        <button class="key small" id="camera" title="Camera: save the current frame">CAMERA</button>
      </div>
    </section>
    <section class="panel">
      <nav class="tabs" id="tabs"></nav>
      <div class="pages" id="pages"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="main.js"></script>
</body>
</html>
